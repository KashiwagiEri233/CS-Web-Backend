name: Backend CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  # 手动触发：用于运行完整集成测试套件
  workflow_dispatch:

# 同一分支上并发构建会因 docker-compose.ci.yml 固定端口（54329/63799）互相踩踏
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ENV_FILE: ".env.test"
  TEST_DATABASE_URL: "postgresql+asyncpg://postgres:postgres@127.0.0.1:54329/witchcat_test"
  DATABASE_URL: "postgresql+asyncpg://postgres:postgres@127.0.0.1:54329/witchcat_test"
  TEST_REDIS_URL: "redis://127.0.0.1:63799/0"
  REDIS_URL: "redis://127.0.0.1:63799/0"
  REQUIRE_INTEGRATION_DB: "1"
  REQUIRE_INTEGRATION_REDIS: "1"
  TESTING: "True"
  DB_AUTO_CREATE_DATABASE: "False"

jobs:
  test:
    name: Test + Lint + Security
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5
        with:
          # ER-45：diff 覆盖率门禁需要与 base 对比新增行，须拉全历史
          fetch-depth: 0

      - name: Setup Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: "requirements-dev.lock"

      - name: Install dependencies
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -c "import sys; assert sys.version_info >= (3, 13), sys.version"

      - name: Start test services (PostgreSQL + Redis)
        run: |
          docker compose -f docker-compose.ci.yml up -d --wait
          # 额外等待 PG 就绪（healthcheck 可能不够）
          sleep 3

      - name: Alembic migration up (baseline → head)
        run: |
          # 验证迁移链可从空库干净应用到 head（Schema 唯一来源=Alembic）。
          # 旧写法 `upgrade 22232b182a66b`（指向一个已不存在的 revision）会导致
          # "Can't locate revision" 必红；且链上存在不可逆迁移
          # (4f5a6b7c8d9e_drop_legacy_forum_blog 无法 downgrade)，故不再做 downgrade 往返，
          # 只做生产一致要求的 upgrade head。
          python -m alembic upgrade head

      - name: Static checks
        run: |
          python -m compileall -q app alembic tools/scripts tools/tests
          python -m black --check app tools/tests alembic tools/scripts run.py
          python -m flake8 app tools/tests alembic tools/scripts run.py
          python -m mypy

      - name: Security static scan (2FA Origin guard + hardcoded secrets)
        run: |
          # G1 发布门禁补充：阻断敏感端点缺 Origin 守卫 / 硬编码密钥。
          # 误报经安全评审后可在此步骤加白名单逻辑豁免。
          python tools/scripts/check/scan_security.py --root app

      # API contract freeze (G3)：2026-08-17 移除本步。
      # 基线 openapi.baseline.json 只在根仓，后端 submodule 的 GitHub Actions checkout 中不存在，
      # export_openapi.py --check 对缺失基线 exit 非零 → 本步必红（与 ER-04 同源问题，基线不可入子模块）。
      # 契约冻结权威 = Jenkinsfile（../openapi.baseline.json）+ 根 `make contract-check`，见 RootDoc-Deploy.md §八。

      - name: Tests with coverage
        run: |
          mkdir -p build
          python -m pytest --cov --cov-report=xml:build/coverage.xml

      - name: PR diff coverage gate (ER-45)
        if: github.event_name == 'pull_request'
        run: |
          # 新增代码（app/**）行覆盖率低于 80% 即失败，拦截「PR 改代码不补测试」
          python tools/scripts/check/diff_coverage.py --base origin/master --threshold 80 \
            --xml build/coverage.xml --src app

      - name: Supply chain audit
        run: |
          python -m pip_audit -r requirements.lock --no-deps --disable-pip --progress-spinner off
          python -m pip_audit -r requirements-dev.lock --no-deps --disable-pip --progress-spinner off
          python -m cyclonedx_py requirements requirements.lock --of JSON -o build/sbom.json
          python -m piplicenses --format=json --output-file=build/licenses.json --fail-on="GPL-3.0-only;GPL-3.0-or-later;AGPL-3.0-only;AGPL-3.0-or-later"

      - name: Upload coverage and SBOM
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-artifacts
          path: build/
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop test services
        if: always()
        run: docker compose -f docker-compose.ci.yml down -v --remove-orphans
