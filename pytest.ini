[pytest]
testpaths = tools/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --strict-markers
# 注：覆盖率参数（--cov*）已从 addopts 移除（ER-45）——本地/单文件测试不再被
# fail_under 全局门禁拖累；需要覆盖率时显式传 --cov，CI 在 ci.yml 显式指定。
asyncio_mode = auto
markers =
    integration: requires external PostgreSQL or Redis services
    queue_integration: requires Redis and the optional arq dependency
