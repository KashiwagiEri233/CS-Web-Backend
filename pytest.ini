[pytest]
testpaths = tools/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --strict-markers --cov=app --cov-config=.coveragerc --cov-report=term-missing --cov-report=xml --cov-branch
asyncio_mode = auto
markers =
    integration: requires external PostgreSQL or Redis services
    queue_integration: requires Redis and the optional arq dependency
