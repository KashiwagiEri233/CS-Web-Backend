<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}FastAPI RBAC 框架{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-50">
    <nav class="bg-blue-600 text-white shadow-md">
        <div class="container mx-auto px-4 py-4 flex justify-between items-center">
            <a href="/admin/" class="text-xl font-bold">{{ title }}</a>
            <div class="flex items-center space-x-4">
                <span>{{ user.username }}</span>
                <a href="/api/v1/auth/logout" class="bg-blue-700 hover:bg-blue-800 px-3 py-1 rounded text-sm">退出</a>
            </div>
        </div>
    </nav>
    
    <div class="container mx-auto px-4 py-6">
        <div class="flex">
            <!-- 侧边栏 -->
            <div class="w-64 bg-white rounded-lg shadow-md p-4 mr-6">
                <h3 class="text-lg font-semibold mb-4">管理菜单</h3>
                <ul class="space-y-2">
                    <li><a href="/admin/" class="block py-2 px-3 rounded hover:bg-gray-100">仪表板</a></li>
                    <li><a href="/admin/users" class="block py-2 px-3 rounded hover:bg-gray-100">用户管理</a></li>
                    <li><a href="/admin/roles" class="block py-2 px-3 rounded hover:bg-gray-100">角色管理</a></li>
                    <li><a href="/admin/permissions" class="block py-2 px-3 rounded hover:bg-gray-100">权限管理</a></li>
                    <li><a href="{{ settings.API_V1_STR }}/docs" class="block py-2 px-3 rounded hover:bg-gray-100">API文档</a></li>
                </ul>
            </div>
            
            <!-- 主内容区 -->
            <div class="flex-1">
                {% block content %}{% endblock %}
            </div>
        </div>
    </div>
    
    <footer class="bg-gray-800 text-white py-4 mt-8">
        <div class="container mx-auto px-4 text-center">
            <p>&copy; 2023 FastAPI RBAC 框架. 版权所有.</p>
        </div>
    </footer>
</body>
</html>
