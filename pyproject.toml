[project]
name = "cs-web-backend"
version = "1.0.1"
requires-python = ">=3.13"
dependencies = [
    "alembic==1.19.1",
    "arq==0.28.0",
    "asyncpg==0.30.0",
    "bcrypt>=5.0.0,<6.0",
    "cryptography>=50.0.0,<51.0",
    "email-validator==2.3.0",
    "fastapi==0.139.0",
    "greenlet>=3.0,<4.0",
    "httpx>=0.28.1,<1.0",
    "loguru==0.7.2",
    "opentelemetry-exporter-otlp==1.44.0",
    "opentelemetry-instrumentation-fastapi==0.63b1",
    "opentelemetry-instrumentation-redis==0.63b1",
    "opentelemetry-instrumentation-sqlalchemy==0.63b1",
    "opentelemetry-sdk==1.44.0",
    "psycopg2-binary==2.9.10",
    "pydantic-settings==2.15.0",
    "pyjwt[crypto]==2.13.0",
    "python-dotenv==1.2.3",
    "python-multipart==0.0.31",
    "redis==8.1.0",
    "sqlalchemy==2.0.51",
    "tzdata>=2026.3",
    "uvicorn[standard]==0.52.4",
    "prometheus-client>=0.20,<0.22",
]

# 测试与开发工具链（C-7/A'：2026-08-17 收敛为 uv 单源）。
# - test：pytest 全家桶，便于本地 `pip install -e ".[test]"` 复现全绿
# - dev：CI/Jenkins 完整工具链（= test + 静态检查 + 供应链审计），
#   requirements-dev.lock 由 `uv export --extra dev --hashed` 生成；
#   pip-tools 已被 uv export 取代，不再声明。
[project.optional-dependencies]
test = [
    "pytest>=9.1.1,<10.0",
    "pytest-cov>=5.0,<8.0",
    "pytest-asyncio>=1.0,<2.0",
]
dev = [
    "httpx2>=2.5,<3.0",
    "black>=26.0,<27.0",
    "flake8>=7.0,<8.0",
    "mypy>=2.0,<3.0",
    "pip-audit>=2.7,<3.0",
    "cyclonedx-bom>=4.0,<8.0",
    "pip-licenses>=4.0,<6.0",
    "pytest>=9.1.1,<10.0",
    "pytest-cov>=5.0,<8.0",
    "pytest-asyncio>=1.0,<2.0",
]

[tool.black]
target-version = ["py313"]
