[project]
name = "fastapi-witchcat-framework"
version = "0.9.7"
requires-python = ">=3.13"
dependencies = [
    "alembic==1.13.1",
    "arq==0.28.0",
    "asyncpg==0.30.0",
    "bcrypt>=4.1,<5.0",
    "cryptography>=43.0,<46.0",
    "email-validator==2.3.0",
    "fastapi==0.139.0",
    "greenlet>=3.0,<4.0",
    "httpx>=0.27,<1.0",
    "loguru==0.7.2",
    "opentelemetry-exporter-otlp==1.42.1",
    "opentelemetry-instrumentation-fastapi==0.63b1",
    "opentelemetry-instrumentation-redis==0.63b1",
    "opentelemetry-instrumentation-sqlalchemy==0.63b1",
    "opentelemetry-sdk==1.42.1",
    "psycopg2-binary==2.9.10",
    "pydantic-settings==2.2.1",
    "pyjwt[crypto]==2.13.0",
    "python-dotenv==1.2.2",
    "python-multipart==0.0.31",
    "redis==5.0.4",
    "sqlalchemy==2.0.51",
    "tzdata>=2024.1",
    "uvicorn[standard]==0.28.0",
]

# 测试依赖（G2：固化 pytest 全家桶，便于本地 `pip install -e ".[test]"` 复现全绿）
# 注意：CI 统一以 requirements-dev.lock 为准（pytest==9.1.1 / pytest-asyncio==1.4.0 /
# pytest-cov==7.1.0），此处版本范围与 lock 保持一致，避免本地与 CI 漂移。
[project.optional-dependencies]
test = [
    "pytest>=9.0,<10.0",
    "pytest-cov>=5.0,<8.0",
    "pytest-asyncio>=1.0,<2.0",
]
